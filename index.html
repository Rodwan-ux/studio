<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PIXEL FORMATION STUDIO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#121214;--panel:#1b1b1f;--line:#2c2c33;--fg:#e6e4e0;--dim:#8e8b86;--gold:#e6ad47;--cyan:#4dccff;--red:#ff8c73;--blood:#d93a3a;--green:#74b84a;--amber:#d1a35c;--violet:#a796c4;--head:"Barlow Condensed","Arial Narrow",sans-serif;--mono:"JetBrains Mono",Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--mono)}
.wrap{max-width:1400px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}h1{margin:0;font:700 28px/1 var(--head);letter-spacing:.05em;color:var(--gold)}
.sub,.muted{color:var(--dim)}.spacer{flex:1}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 9px}
button{cursor:pointer;text-transform:uppercase;letter-spacing:.05em}button:hover{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
nav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
nav button{border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0;background:transparent;font:600 16px var(--head);letter-spacing:.1em;color:var(--dim);padding:6px 14px}
nav button[aria-selected=true]{color:var(--gold);background:var(--panel);border-color:var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);padding:12px;display:grid;gap:10px;min-width:0}
h2{margin:0;font:600 18px var(--head);letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
h3{margin:0;font:600 15px var(--head);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);padding:8px 10px;display:grid;gap:2px;min-width:0}
.tile b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}.tile span{font:600 13px var(--head);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bar label{font:600 13px var(--head);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:600 13px var(--head);letter-spacing:.1em;color:var(--gold);text-transform:uppercase;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 6px;border-bottom:1px solid #222228;vertical-align:top;font-size:12.5px}td.num{text-align:right}td.x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px;cursor:pointer}td.x.open{white-space:normal;overflow-wrap:anywhere}td{white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#232329}tr.sel td{background:#1d2a31}
.chip{display:inline-block;padding:0 7px;border-radius:9px;border:1px solid currentColor;font-size:11px;white-space:nowrap}
.who b{font-weight:600}.who .nm{color:var(--cyan);white-space:nowrap}
.sev-BLOCKER{color:var(--blood)}.sev-CRITICAL{color:var(--red)}.sev-MAJOR{color:var(--amber)}.sev-MINOR{color:var(--dim)}
.st-NEW{color:var(--gold)}.st-CONFIRMED{color:var(--cyan)}.st-IN_PROGRESS{color:var(--violet)}.st-FIXED{color:var(--green)}.st-REJECTED,.st-DUPLICATE{color:var(--dim)}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media (max-width:620px){.board{grid-template-columns:1fr}}.newbugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.col{background:var(--bg);border:1px solid var(--line);padding:6px;display:grid;gap:6px;align-content:start;min-width:0}
.col h3{display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);padding:6px 8px;display:grid;gap:3px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--cyan)}.card.on{border-color:var(--cyan);background:#1d2a31}.card.mine{box-shadow:inset 0 0 0 1px var(--gold)}
.card .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.card .d{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.detail{border:1px solid var(--cyan);padding:10px;display:grid;gap:8px;background:var(--bg)}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.4 var(--mono);color:var(--dim);max-height:260px;overflow:auto}
.msg{padding:8px 10px;border:1px dashed var(--line);color:var(--dim)}.msg.err{border-color:var(--red);color:var(--red)}
a{color:var(--cyan)}.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--dim)}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}
.tl{position:relative}.tl svg{display:block;width:100%;height:auto}.tip{position:absolute;pointer-events:none;background:#0c0c0e;border:1px solid var(--cyan);padding:6px 8px;max-width:360px;z-index:5;font-size:12px;white-space:pre-wrap}
.cl-v{display:flex;gap:10px;align-items:baseline;margin-top:8px}.cl-row{padding:4px 6px;border-bottom:1px solid #222228;min-width:0}.cl-row.has{cursor:pointer}.cl-row.has:hover{background:#232329}.cl-t{color:var(--gold)}.cl-d{display:none;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}.cl-row.open .cl-d{display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal-h{font:600 13px var(--head);letter-spacing:.1em;color:var(--dim);text-align:center}.cal-d{background:var(--bg);border:1px solid var(--line);min-height:64px;padding:3px 5px;display:block;min-width:0}.cal-d.past{opacity:.45}.cal-d.today{border-color:var(--cyan)}.cal-n{float:right;margin:0 0 2px 4px;font-size:10px;line-height:1.2;color:var(--dim)}.cal-d.today .cal-n{color:var(--cyan)}.cal-e{font-size:11px;background:#232329;border-left:2px solid var(--gold);padding:1px 4px;overflow-wrap:anywhere;line-height:1.3}.cal-e{display:block;margin-bottom:2px}.cal-e .tm{color:var(--dim)}.g-YES{color:var(--green)}.g-NO{color:var(--red)}.g-MAYBE{color:var(--amber)}.g-INVITED{color:var(--dim)}.cal-g{display:block;font-size:10px}.cal-join{display:inline-block;margin-top:1px;font-size:10px;padding:0 5px;border:1px solid var(--green);border-radius:3px;color:var(--green);text-decoration:none}.cal-join:hover{background:#1c2a18}.join-big{display:inline-block;padding:4px 12px;border:1px solid var(--green);border-radius:4px;color:var(--green);text-decoration:none;font:600 15px var(--head);letter-spacing:.1em}.cal-tag{display:inline-block;margin-left:4px;padding:0 4px;border:1px solid var(--cyan);border-radius:3px;color:var(--cyan);font-size:10px;white-space:nowrap}.cal-d.has{cursor:pointer}.cal-d.has:hover{border-color:var(--gold)}.cal-d.sel{border-color:var(--gold);background:#1f1c16}.cal-day{border:1px solid var(--gold);padding:10px;display:grid;gap:10px;background:var(--bg)}.cal-day .ev{display:grid;gap:3px}.cal-day .ev pre{max-height:none;color:var(--fg)}
.tl2-wrap{display:grid;grid-template-columns:104px minmax(0,1fr);border:1px solid var(--line);background:var(--bg)}
.tl2-labels>div{font:600 12px var(--head);letter-spacing:.1em;color:var(--dim);padding:0 8px;display:flex;align-items:center;border-bottom:1px solid #222228;text-transform:uppercase}
.tl2-scroll{overflow-x:auto;overflow-y:hidden}.tl2-inner{position:relative}
.tl2-cols{position:absolute;left:0;top:0;bottom:0;display:flex;pointer-events:none}.tl2-cols>div{flex:none;height:100%;border-left:1px solid transparent}
.tl2-cols .we{background:#17171b}.tl2-cols .mon{border-left-color:#26262d}.tl2-cols .m1{border-left-color:#3d3d47}.tl2-cols .td{background:#16232a;box-shadow:inset 0 0 0 1px var(--cyan)}.tl2-cols .past{opacity:.55}
.tl2-row{position:relative;border-bottom:1px solid #222228}
.tl2-row.months span{position:absolute;top:0;bottom:0;padding:3px 6px;font:600 12px var(--head);letter-spacing:.1em;color:var(--gold);white-space:nowrap;overflow:hidden}
.tl2-row.days span{position:absolute;top:0;bottom:0;font-size:10px;color:var(--dim);text-align:center;line-height:1.25;padding-top:3px;overflow:hidden}.tl2-row.days span.td{color:var(--cyan);font-weight:600}
.tl2-ev{position:absolute;height:18px;font-size:10px;line-height:16px;padding:0 4px;background:#232329;border:1px solid;border-left-width:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--fg);box-sizing:border-box}
.tl2-ev:hover{background:#2c2c33}
.card[draggable=true]{cursor:grab}.col.drop{border-color:var(--cyan);background:#16232a}
.viewbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--violet);color:var(--violet);font:600 15px var(--head);letter-spacing:.1em}.viewbar b{color:var(--fg)}
.hello{font:600 18px var(--head);letter-spacing:.08em;color:var(--fg)}.hello b{color:var(--cyan)}
input.link{width:100%;min-width:220px;color:var(--dim)}
[hidden]{display:none!important}
</style></head><body><div class="wrap">
<header><h1>PIXEL FORMATION STUDIO</h1><span class="hello" id="hello"></span><select id="view-as" hidden aria-label="View as"></select><span class="sub" id="status">Loading...</span><span class="spacer"></span><button id="refresh">Refresh</button></header>
<div class="viewbar" id="viewbar" hidden>VIEWING AS <b id="viewbar-cat"></b><span class="muted">what this category sees; status changes are off</span><span class="spacer"></span><button id="viewbar-back">Back to owner</button></div>
<div class="panel" id="key-box" hidden><div class="bar"><label for="key-in">Your key</label><input id="key-in" autocomplete="off" style="flex:1;min-width:220px" placeholder="KEY FROM THE PERSON WHO INVITED YOU"><button id="key-go">Open</button></div></div>
<nav id="tabs">
<button data-tab="overview" aria-selected="false" hidden>OVERVIEW</button><button data-tab="bugs" aria-selected="false" hidden>BUGS</button>
<button data-tab="tasks" aria-selected="false" hidden>TASKS</button><button data-tab="telemetry" aria-selected="false" hidden>TELEMETRY</button>
<button data-tab="people" aria-selected="false" hidden>PEOPLE</button><button data-tab="changelog" aria-selected="false" hidden>CHANGELOG</button><button data-tab="calendar" aria-selected="false" hidden>CALENDAR</button>
<button data-tab="files" aria-selected="false" hidden>FILES</button></nav>

<section class="panel" data-pane="overview" hidden><div class="tiles" id="ov-tiles"></div><div class="cols">
<div class="panel"><h2>Latest sessions</h2><div id="ov-sess"></div></div>
<div class="panel" id="ov-cal-p"><h2>Coming up</h2><div id="ov-cal"></div></div></div>
</section>

<section class="panel" data-pane="bugs" hidden>
<div class="tiles" id="b-tiles"></div>
<div class="panel" id="b-new-p"><h2>New bugs</h2><div class="newbugs" id="b-new"></div></div>
<div class="bar"><input id="b-q" type="search" placeholder="SEARCH ID, TEXT OR TESTER..." style="flex:1;min-width:200px">
<label for="b-sev">Severity</label><select id="b-sev"></select><label for="b-type">Type</label><select id="b-type"></select>
<label for="b-who">Tester</label><select id="b-who"></select><label id="b-mine-l" hidden><input type="checkbox" id="b-mine"> my reports</label><label><input type="checkbox" id="b-closed"> rejected / duplicate</label></div>
<div id="b-msg" class="msg" hidden></div><div class="detail" id="b-detail" hidden></div><div class="board" id="b-board"></div></section>

<section class="panel" data-pane="tasks" hidden>
<div class="bar"><input id="t-q" type="search" placeholder="SEARCH NUMBER OR TEXT..." style="flex:1;min-width:200px">
<label for="t-st">State</label><select id="t-st"><option value="active">OPEN + DOING</option><option value="doing">DOING</option><option value="open">OPEN</option><option value="bug">WITH A BUG</option><option value="done">DONE</option></select>
<label for="t-code">Kind</label><select id="t-code"></select><span class="muted" id="t-n"></span></div>
<div id="t-msg" class="msg" hidden></div><div class="scroll"><table id="t-t"></table></div></section>

<section class="panel" data-pane="telemetry" hidden>
<nav id="tel-tabs"><button data-t="feedback" aria-selected="true">FEEDBACK</button><button data-t="sessions" aria-selected="false">SESSIONS</button><button data-t="timeline" aria-selected="false">TIMELINE</button><button data-t="events" aria-selected="false">EVENTS</button></nav>
<div data-tp="feedback"><div class="bar"><input id="fb-q" type="search" placeholder="SEARCH TEXT OR PERSON..." style="flex:1;min-width:200px"><span class="muted" id="fb-n"></span></div><div id="fb-msg" class="msg" hidden></div><div class="scroll"><table id="fb-t"></table></div></div>
<div data-tp="sessions" hidden><div class="bar"><select id="s-mode" aria-label="Sessions view"><option value="person">BY PERSON</option><option value="session">BY SESSION</option></select><label for="s-code">Person</label><select id="s-code"></select><span class="muted" id="s-hint"></span></div><div class="scroll"><table id="sess-t"></table></div></div>
<div data-tp="timeline" hidden><div class="bar"><label for="tl-sess">Session</label><select id="tl-sess"></select></div><div class="legend" id="tl-legend"></div><div class="tl" id="tl"><div class="tip" id="tip" hidden></div></div></div>
<div data-tp="events" hidden><div class="bar"><input id="ev-q" type="search" placeholder="SEARCH EVENT OR VALUES..." style="flex:1;min-width:200px"><label for="ev-code">Person</label><select id="ev-code"></select><label for="ev-cat">Kind</label><select id="ev-cat"></select><span class="muted" id="ev-n"></span></div><div class="scroll"><table id="ev-t"></table></div><button id="ev-more" hidden>Show more</button></div>
</section>

<section class="panel" data-pane="people" hidden>
<div class="bar"><input id="p-q" type="search" placeholder="SEARCH NAME, MAIL, CODE..." style="flex:1;min-width:200px">
<label for="p-cat">Category</label><select id="p-cat"></select><span class="muted" id="p-n"></span></div>
<div class="scroll"><table id="p-t"></table></div></section>

<section class="panel" data-pane="changelog" hidden><div id="cl"></div></section>
<section class="panel" data-pane="calendar" hidden>
<nav id="cal-tabs"><button data-c="grid" aria-selected="true">CALENDAR</button><button data-c="timeline" aria-selected="false">TIMELINE</button><span class="spacer"></span><a href="https://calendar.google.com" target="_blank" rel="noopener" style="align-self:center">OPEN GOOGLE CALENDAR</a></nav>
<div class="cal-day" id="cal-day" hidden></div>
<div data-cp="grid"><div id="cal"></div></div>
<div data-cp="timeline" hidden><div class="bar"><button id="tl2-out">Zoom out</button><button id="tl2-in">Zoom in</button><button id="tl2-today">Today</button><span class="muted" id="tl2-scale"></span></div><div id="tl2"></div></div>
</section>
<section class="panel" data-pane="files" hidden><div class="bar" id="f-bar" hidden><a id="f-open" target="_blank" rel="noopener">OPEN THE SHARES FOLDER</a><span class="muted">A sub-folder = a package; its name in someone's PACKAGES (PEOPLE tab) gives it to them.</span></div><div id="files"></div></section>
</div>
<script>
// PIXEL FORMATION STUDIO (1184.4 / 1184.7): this page asks the PLAYTEST web app for its data, without cookies (as the
// game does). Opened through the link (API + ?k=KEY) the web app puts the key in (PRESET_KEY); opened from the disk the
// key is typed once. Either way it is remembered in this browser.
var API = "https://script.google.com/macros/s/AKfycbxh3QH8N51TvszNQc9sCDNQUU9qZ-CSO7vN7MKF5aiZ1-E3R-2YlydVR7BfU566igPJxQ/exec";
var KEY = "";
try { KEY = localStorage.getItem("studio_key") || ""; } catch (e) {}
if (typeof PRESET_KEY === "string" && PRESET_KEY) saveKey(PRESET_KEY);
// 1184.8: the page on GitHub Pages (SITE) takes the key from its link, SITE?k=KEY, the link TEAM LINKS gives out.
var SITE = "https://rodwan-ux.github.io/studio/";
(function () { var m = location.search.match(/[?&]k=([\w-]+)/); if (m && location.protocol !== "file:") { saveKey(m[1]); history.replaceState(null, "", location.pathname); } })();
function saveKey(k) { KEY = k; try { if (k) localStorage.setItem("studio_key", k); else localStorage.removeItem("studio_key"); } catch (e) {} }
function apiGet(params) {
  return fetch(API + "?" + new URLSearchParams(params), { credentials: "omit" }).then(function (r) { return r.text(); }).then(function (t) {
    var j; try { j = JSON.parse(t); } catch (e) { throw new Error("The panel's address did not answer with data"); }
    if (j && j.error) throw new Error(j.error);
    return j;
  });
}
function apiPost(body) {
  return fetch(API, { method: "POST", body: JSON.stringify(body), credentials: "omit" }).then(function (r) { return r.text(); }).then(function (t) { if (t !== "OK") throw new Error(t); });
}
// 1184.11: the owner's VIEW AS (a category), "" = as the owner
var VIEW_AS = "";
var D = null, pickedBug = "", pickedSession = "", evLimit = 300, openTask = {}, curTab = "";
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var fmtSec = function (s) { s = Math.max(0, Math.round(+s || 0)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
var short = function (s) { s = String(s || ""); return /^\d{4}-\d\d-\d\d/.test(s) ? s.slice(5, 16) : s; };
var day = function (ms) { return new Date(ms).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); };
var hm = function (ms) { return new Date(ms).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); };
var allowed = function (t) { return !!D && D.tabs.indexOf(t) >= 0; };
function table(v) { v = v || []; if (!v.length) return { head: [], rows: [] }; var head = v[0].map(String); return { head: head, rows: v.slice(1).map(function (r) { var o = {}; head.forEach(function (h, i) { o[h] = r[i] == null ? "" : r[i]; }); return o; }) }; }
function grid(specs, rows, rowAttr) {
  var used = specs.filter(function (s) { return rows.some(function (r) { var v = s[1](r); return v !== "" && v != null; }); });
  return "<thead><tr>" + used.map(function (s) { return "<th class='" + (typeof s[2] === "string" ? s[2] : "") + "'>" + esc(s[0]) + "</th>"; }).join("") + "</tr></thead><tbody>" +
    rows.map(function (r) { return "<tr" + (rowAttr ? rowAttr(r) : "") + ">" + used.map(function (s) { var v = s[1](r), cls = typeof s[2] === "function" ? s[2](r) : s[2] || ""; return "<td class='" + cls + "'>" + (v == null ? "" : v) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
}
// people by game code, built once per load; a code with no NAME = UNNAMED TESTER n (codes are shown only in PEOPLE)
var _people = null, _unnamed = null;
function person(code) {
  if (!_people) { _people = {}; table(D && D.people).rows.forEach(function (r) { _people[String(r.CODE).toLowerCase()] = { name: r.NAME || "", type: r.TYPE || "" }; }); }
  return _people[String(code || "").toLowerCase()] || { name: "", type: "" };
}
function nameOf(code) {
  var p = person(code);
  if (p.name) return p.name;
  if (!_unnamed) {
    _unnamed = {};
    var seen = {};
    table(D.events).rows.forEach(function (r) { seen[String(r.CODE).toLowerCase()] = 1; });
    table(D.bugs && D.bugs.values).rows.forEach(function (r) { seen[String(r.CODE).toLowerCase()] = 1; });
    (D.feedback || []).forEach(function (f) { seen[String(f.code).toLowerCase()] = 1; });
    Object.keys(seen).filter(function (c) { return c && !person(c).name; }).sort().forEach(function (c, i) { _unnamed[c] = "UNNAMED TESTER " + (i + 1); });
  }
  return _unnamed[String(code || "").toLowerCase()] || "UNNAMED TESTER";
}
function who(code) { return "<span class='nm'>" + esc(nameOf(code)) + "</span>"; }

// tabs (the last one picked is remembered in this browser)
function showTab(t) {
  if (!allowed(t)) t = D.tabs[0];
  curTab = t;
  document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === t)); });
  document.querySelectorAll("[data-pane]").forEach(function (p) { p.hidden = p.dataset.pane !== t; });
  try { localStorage.setItem("tab", t); } catch (e) {}
  if (t === "telemetry") drawTimeline();
}
$("tabs").addEventListener("click", function (e) { var b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
function showTel(t) { document.querySelectorAll("#tel-tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.t === t)); }); document.querySelectorAll("[data-tp]").forEach(function (p) { p.hidden = p.dataset.tp !== t; }); if (t === "timeline") drawTimeline(); }
$("tel-tabs").addEventListener("click", function (e) { var b = e.target.closest("button[data-t]"); if (b) showTel(b.dataset.t); });

// loading
function load() {
  if (!KEY) { askKey(""); return; }
  $("status").textContent = "Loading...";
  apiGet(VIEW_AS ? { api: "data", k: KEY, as: VIEW_AS } : { api: "data", k: KEY }).then(function (j) { D = j; evCache = null; _people = null; _unnamed = null; $("key-box").hidden = true; render(); }, function (e) {
    var m = String(e && e.message || e);
    if (m === "No access") { saveKey(""); askKey("This key does not open the panel."); return; }
    $("status").textContent = "Could not load: " + m;
  });

    lanes[ln] += "<div class='tl2-ev' data-day='" + calKey(new Date(e.start)) + "' title='" + esc(day(e.start) + "  " + (e.allDay ? "" : tzTime(e.start, "Europe/Warsaw") + " ") + e.title) + "' style='left:" + (Math.max(a, 0) * W + 1) + "px;width:" + Math.max(W * (b - Math.max(a, 0)) - 2, 6) + "px;top:" + (6 + row * 21) + "px;border-color:" + lane[2] + "'>" + esc(label) + "</div>";
  });
  box.innerHTML = "<div class='tl2-wrap'><div class='tl2-labels'><div style='height:22px'></div><div style='height:" + dayH + "px'></div>" +
    TL2_LANES.map(function (l) { return "<div style='height:" + laneH + "px;color:" + l[2] + "'>" + l[1] + "</div>"; }).join("") + "</div>" +
    "<div class='tl2-scroll' data-w='" + W + "'><div class='tl2-inner' style='width:" + total + "px'><div class='tl2-cols'>" + cols + "</div>" +
    "<div class='tl2-row months' style='height:22px'>" + months + "</div><div class='tl2-row days' style='height:" + dayH + "px'>" + dlab + "</div>" +
    TL2_LANES.map(function (l) { return "<div class='tl2-row' style='height:" + laneH + "px'>" + lanes[l[0]] + "</div>"; }).join("") + "</div></div></div>";
  $("tl2-scale").textContent = W >= 64 ? "DAYS" : W >= 16 ? "WEEKS" : "MONTHS";
  $("tl2-out").disabled = tl2Zoom === 0; $("tl2-in").disabled = tl2Zoom === TL2_W.length - 1;
  sc = box.querySelector(".tl2-scroll");
  var center = tl2Center !== null ? tl2Center : keep !== null ? keep : tIdx + 0.5;
  tl2Center = null;
  sc.scrollLeft = Math.max(0, center * W - sc.clientWidth / 2);
}
function tl2SetZoom(z) { tl2Zoom = Math.max(0, Math.min(TL2_W.length - 1, z)); try { localStorage.setItem("tl2_zoom", tl2Zoom); } catch (e) {} renderTimeline(); }
$("tl2-out").addEventListener("click", function () { tl2SetZoom(tl2Zoom - 1); });
$("tl2-in").addEventListener("click", function () { tl2SetZoom(tl2Zoom + 1); });
$("tl2-today").addEventListener("click", function () { tl2Center = 30.5; renderTimeline(); });
$("tl2").addEventListener("click", function (e) { var ev = e.target.closest(".tl2-ev"); if (!ev) return; calPicked = ev.dataset.day; renderCalendar(); $("cal-day").scrollIntoView({ block: "nearest" }); });

function renderFiles() {
  if (!D.files) { $("files").innerHTML = "<div class='msg err'>FILES did not load: " + esc(D.errors.files || "") + "</div>"; return; }
  $("f-bar").hidden = !D.files.url; if (D.files.url) $("f-open").href = D.files.url;
  if (!D.files.packages.length) { $("files").innerHTML = "<div class='msg'>" + (D.category === "OWNER" ? "No packages yet. Make a sub-folder in SHARES (e.g. DIALOGS_PL), put the files in, write its name in someone's PACKAGES." : "Nothing here for you yet.") + "</div>"; return; }
  $("files").innerHTML = D.files.packages.map(function (p) { return "<div class='panel'><div class='bar'><h2>" + esc(p.name) + "</h2>" + (p.url ? "<a href='" + esc(p.url) + "' target='_blank' rel='noopener'>OPEN</a>" : "") + (p.people ? "<span class='muted'>" + (p.people.length ? "for " + esc(p.people.join(", ")) : "nobody has it yet") + "</span>" : "") + "</div>" +
    (p.files.length ? "<table>" + p.files.map(function (f) { return "<tr><td>" + esc(f.name) + "</td><td class='num muted'>" + (f.size / 1048576).toFixed(2) + " MB</td><td class='muted'>" + esc(new Date(f.updated).toLocaleDateString()) + "</td><td><button data-f='" + esc(f.id) + "'>Download</button></td></tr>"; }).join("") + "</table>" : "<div class='muted'>Empty.</div>") + "</div>"; }).join("");
}
$("files").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-f]"); if (!b) return;
  b.disabled = true; b.textContent = "Getting...";
  apiGet({ api: "download", k: KEY, f: b.dataset.f }).then(function (f) {
    var bin = atob(f.data), bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([bytes], { type: f.type })); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove(); b.disabled = false; b.textContent = "Download";
  }, function (err) { b.disabled = false; b.textContent = "Failed: " + (err && err.message || err); });
});
load();
