<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PLAY PIXEL FORMATION</title>
<link rel="icon" href="studio.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#121214;--panel:#1b1b1f;--line:#2c2c33;--fg:#e6e4e0;--dim:#8e8b86;--gold:#e6ad47;--cyan:#4dccff;--red:#ff8c73;--head:"Barlow Condensed","Arial Narrow",sans-serif;--mono:"JetBrains Mono",Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 var(--mono)}
.gate{min-height:100%;display:grid;place-content:center;justify-items:center;gap:26px;padding:24px 16px}
form{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
input,button{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:8px 12px}
input{width:240px;text-align:center;letter-spacing:.12em;text-transform:lowercase}
button{cursor:pointer;font:600 18px var(--head);letter-spacing:.14em;padding:6px 22px;color:var(--gold);border-color:var(--gold)}
button:hover{background:#1f1c16}button:disabled{opacity:.4;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
#msg{min-height:20px;font:600 15px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:center}
#msg.err{color:var(--red)}#msg.ok{color:var(--gold)}
#gpu{max-width:min(608px,92vw);font:600 13px var(--head);letter-spacing:.1em;color:var(--dim);text-align:center}
.track{width:min(608px,92vw);height:8px;background:repeating-linear-gradient(90deg,#232329 0 6px,#17171b 6px 8px);border:2px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#b98a35 6px 8px)}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
[hidden]{display:none!important}
</style></head><body>
<div class="gate" id="gate">
<form id="f" autocomplete="off"><input id="code" placeholder="YOUR CODE" spellcheck="false" aria-label="Your code"><button id="go" type="submit">PLAY</button></form>
<div class="track" id="track" hidden><i id="bar"></i></div>
<div id="msg"></div>
<div id="gpu"></div>
</div>
<canvas id="canvas" hidden>Your browser does not support the canvas tag.</canvas>
<script>
// 1325: the PLAY gate — a page of its own in front of the game (no Godot, no game code until the code opens it).
// The code is the key: PBKDF2-SHA256(code, salt) -> 64 bytes; the first 32 name the code's entry in gate.json, the last 32
// open it and give the game key (AES-256-GCM). The game's main pack comes as sealed chunks spread over parts under
// 100 MB; each chunk is opened in memory as it arrives and laid straight into one buffer (no second copy, nothing open
// on disk - only the sealed files are kept, 1422), which goes to Godot as its main pack. Made by 05_TOOLS/GATE/gate_pack.js. ?b=<folder/> = where the build is.
// 1417: the build lives in its own Pages repo (Rodwan-ux/play); its music tracks are opened one at a time when the game
// plays them (window.pfGate.music, asked by the game's browser player). ?v= on each file = the build, so a new build is
// never mixed with parts the browser still holds from the last one.
var B = new URLSearchParams(location.search).get("b") || "../play/";
var TD = (new URLSearchParams(location.search).get("td") || "").replace(/[^a-z0-9_ =,-]/g, "");   // plan + its options ("voyage --off=water")
var $ = function (id) { return document.getElementById(id); };


var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
var hex = function (buf) { return Array.from(new Uint8Array(buf), function (x) { return x.toString(16).padStart(2, "0"); }).join(""); };
function say(t, cls) { $("msg").textContent = t; $("msg").className = cls || ""; }

// the game key for a code, or null for a code that is not on the list
async function gameKey(meta, code) {
  var enc = new TextEncoder();
  var pass = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(meta.salt), iterations: meta.iter, hash: "SHA-256" }, pass, 512));
  var idk = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  var e = meta.keys[hex(await crypto.subtle.sign("HMAC", idk, enc.encode("id"))).slice(0, 16)];
  if (!e) return null;
  var wk = await crypto.subtle.importKey("raw", bits.slice(32), "AES-GCM", false, ["decrypt"]);
  var raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.iv) }, wk, b64(e.key));
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
}

// 1422: the sealed files are kept in the browser (IndexedDB "pf-play", the key = the file's build address ?v=), so a
// later visit reads them from the disk and a new build fetches only its own files; files of other builds are dropped.
// A file is stored as it streams in (no second download). Only sealed bytes are stored - without a code they open nothing.
var DB = null;
function idb() {
  return DB || (DB = new Promise(function (ok, no) {
    var q = indexedDB.open("pf-play", 1);
    q.onupgradeneeded = function () { q.result.createObjectStore("files"); };
    q.onsuccess = function () { ok(q.result); }; q.onerror = function () { no(q.error); };
  }));
}
async function idbGet(k) {
  try { var db = await idb(); return await new Promise(function (ok) { var r = db.transaction("files").objectStore("files").get(k); r.onsuccess = function () { ok(r.result || null); }; r.onerror = function () { ok(null); }; }); }
  catch (e) { return null; }
}
function idbPut(k, v) { idb().then(function (db) { db.transaction("files", "readwrite").objectStore("files").put(v, k); }).catch(function () {}); }
// a sealed file as a Response: from the browser's store, else fetched (and stored once it is all in)
async function sealed(url) {
  var b = await idbGet(url);
  if (b) return new Response(b);
  var res = await fetch(url);
  if (!res.ok) return res;
  var rd = res.body.getReader(), keep = [];
  return new Response(new ReadableStream({ pull: async function (c) {
    var r = await rd.read();
    if (r.done) { idbPut(url, new Blob(keep)); c.close(); return; }
    keep.push(r.value); c.enqueue(r.value);
  } }));
}
async function dropOldBuilds(tag) {
  try {
    var db = await idb(), st = db.transaction("files", "readwrite").objectStore("files"), q = st.getAllKeys();
    q.onsuccess = function () { q.result.forEach(function (k) { if (String(k).indexOf("v=" + tag) < 0) st.delete(k); }); };
  } catch (e) {}
}

var join = function (list, len) { var j = new Uint8Array(len), at = 0; list.forEach(function (x) { j.set(x, at); at += x.length; }); return j; };

// 1419: a chunk is deflated before it is sealed - inflated here after opening
var inflate = async function (u8) { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); };

// the parts, opened chunk by chunk as they arrive (each chunk's sealed length in meta.lens), laid into one buffer of
// the game file's size
async function openParts(meta, key) {
  var out = new Uint8Array(meta.size), base = b64(meta.iv);
  var bits = [], have = 0, off = 0, n = 0;   // the bytes not opened yet (joined only once a whole chunk is in)
  var openChunk = async function (bytes) {
    var iv = new Uint8Array(12); iv.set(base); new DataView(iv.buffer).setUint32(8, n++);
    var p;
    try { p = await inflate(new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, bytes))); }
    catch (e) { throw new Error("the game file is damaged (part " + (n - 1) + ")"); }
    out.set(p, off); off += p.length;
    $("bar").style.width = (off * 100 / meta.size) + "%";
  };
  for (var i = 0; i < meta.parts.length; i++) {
    var res = await sealed(B + meta.parts[i] + "?v=" + meta.sha256.slice(0, 12));
    if (!res.ok) throw new Error("part " + meta.parts[i] + " did not load (" + res.status + ")");
    var rd = res.body.getReader();
    for (;;) {
      var r = await rd.read();
      if (r.done) break;
      bits.push(r.value); have += r.value.length;
      if (n >= meta.lens.length || have < meta.lens[n]) continue;
      var joined = join(bits, have), at = 0;
      while (n < meta.lens.length && joined.length - at >= meta.lens[n]) { var L = meta.lens[n]; await openChunk(joined.subarray(at, at + L)); at += L; }
      bits = [joined.slice(at)]; have = bits[0].length;
    }
  }
  if (off !== meta.size || n !== meta.lens.length) throw new Error("the game file came in short");
  return out;
}

// 1417: a music track for the game's browser player - its sealed file opened in memory, handed back as a blob URL; the
// track before it is let go, so only the one playing stays in memory
function musicGate(meta, key) {
  var last = "";
  window.pfGate = { music: async function (url) {
    var f = String(url).split("/").pop(), iv = meta.music[f];
    if (!iv) throw new Error("no such track " + f);
    var res = await sealed(B + "music/" + f + ".enc?v=" + meta.sha256.slice(0, 12));
    if (!res.ok) throw new Error("track " + f + " did not load (" + res.status + ")");
    var data = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv) }, key, await res.arrayBuffer());
    if (last) URL.revokeObjectURL(last);
    return (last = URL.createObjectURL(new Blob([data], { type: "audio/mpeg" })));
  } };
}

// 1419: on a computer with two GPUs the browser hands WebGL the low-power one unless asked - every WebGL context the
// engine makes asks for the high-performance GPU
(function () {
  var get = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (kind, attrs) {
    if (/^(webgl2?|experimental-webgl)$/.test(kind)) attrs = Object.assign({}, attrs || {}, { powerPreference: "high-performance" });
    return get.call(this, kind, attrs);
  };
})();

// 1423: which GPU the game will get - a test context asking for the high-performance one; an integrated or software
// renderer means the browser ignored the request, so one line tells how to switch the browser to the main GPU
(function () {
  try {
    var g = document.createElement("canvas").getContext("webgl2"), e = g && g.getExtension("WEBGL_debug_renderer_info");
    var r = e ? String(g.getParameter(e.UNMASKED_RENDERER_WEBGL)) : "";
    if (/Intel|UHD|Iris|SwiftShader|Basic Render|llvmpipe/i.test(r))
      $("gpu").textContent = "THE BROWSER USES THE LOW-POWER GPU - FOR A SMOOTH GAME SET IT TO HIGH PERFORMANCE IN WINDOWS SETTINGS > SYSTEM > DISPLAY > GRAPHICS";
  } catch (x) {}
})();

// the game: Godot's own loader from the build folder, fed the opened file as its main pack
function startGodot(meta, pack, code) {
  return new Promise(function (ok, fail) {
    var s = document.createElement("script"); s.src = B + "index.js"; s.onerror = function () { fail(new Error("the game engine did not load")); };
    s.onload = function () {
      // 1419: ?td=<plan> hands a test drive plan to the game (only the WEB TEST build carries the rig)
      var user = ["gate_code=" + code].concat(TD ? ["testdrive=" + TD] : []);
      var cfg = Object.assign({}, meta.godot, { executable: B + "index", canvas: $("canvas"), args: ["--"].concat(user) });
      var engine = new Engine(cfg);
      $("gate").hidden = true; $("canvas").hidden = false;
      engine.init(B + "index").then(function () { return engine.preloadFile(pack.buffer, "index.pck"); })
        .then(function () { return engine.start({ args: ["--main-pack", "index.pck", "--"].concat(user) }); }).then(ok, fail);
    };
    document.body.appendChild(s);
  });
}

$("f").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  var code = $("code").value.trim().toLowerCase();
  if (!code) return;
  $("go").disabled = true; say("CHECKING THE CODE...");
  try {
    var meta = await (await fetch(B + "gate.json", { cache: "no-store" })).json();
    var key = await gameKey(meta, code);
    if (!key) { say("THIS CODE DOES NOT OPEN THE GAME", "err"); $("go").disabled = false; return; }
    say("UNPACKING THE GAME...", "ok"); $("track").hidden = false;
    dropOldBuilds(meta.sha256.slice(0, 12));
    var pack = await openParts(meta, key);
    musicGate(meta, key);
    say("STARTING...", "ok");
    await startGodot(meta, pack, code);
  } catch (e) {
    say(String(e && e.message || e), "err"); $("go").disabled = false;
  }
});
$("code").focus();
</script></body></html>
