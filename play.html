<script>
// 1325: the PLAY gate — a page of its own in front of the game (no Godot, no game code until the code opens it).
// The code is the key: PBKDF2-SHA256(code, salt) -> 64 bytes; the first 32 name the code's entry in gate.json, the last 32
// open it and give the game key (AES-256-GCM). The game's main pack comes as sealed chunks spread over parts under
// 100 MB; each chunk is opened in memory as it arrives and laid straight into one buffer (no second copy, nothing on
// disk), which goes to Godot as its main pack. Made by 05_TOOLS/GATE/gate_pack.js. ?b=<folder/> = where the build is.
// 1417: the build lives in its own Pages repo (Rodwan-ux/play); its music tracks are opened one at a time when the game
// plays them (window.pfGate.music, asked by the game's browser player). ?v= on each file = the build, so a new build is
// never mixed with parts the browser still holds from the last one.
var B = new URLSearchParams(location.search).get("b") || "../play/";
var $ = function (id) { return document.getElementById(id); };


var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
var hex = function (buf) { return Array.from(new Uint8Array(buf), function (x) { return x.toString(16).padStart(2, "0"); }).join(""); };
function say(t, cls) { $("msg").textContent = t; $("msg").className = cls || ""; }

// the game key for a code, or null for a code that is not on the list
async function gameKey(meta, code) {
  var enc = new TextEncoder();
  var pass = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(meta.salt), iterations: meta.iter, hash: "SHA-256" }, pass, 512));
  var idk = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  var e = meta.keys[hex(await crypto.subtle.sign("HMAC", idk, enc.encode("id"))).slice(0, 16)];
  if (!e) return null;
  var wk = await crypto.subtle.importKey("raw", bits.slice(32), "AES-GCM", false, ["decrypt"]);
  var raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.iv) }, wk, b64(e.key));
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
}

var join = function (list, len) { var j = new Uint8Array(len), at = 0; list.forEach(function (x) { j.set(x, at); at += x.length; }); return j; };

// the parts, opened chunk by chunk as they arrive, laid into one buffer of the game file's size
async function openParts(meta, key) {
  var out = new Uint8Array(meta.size), base = b64(meta.iv), sealed = meta.chunk + 16;
  var bits = [], have = 0, off = 0, n = 0;   // the bytes not opened yet (joined only once a whole chunk is in)
  var openChunk = async function (bytes) {
    var iv = new Uint8Array(12); iv.set(base); new DataView(iv.buffer).setUint32(8, n++);
    var p;
    try { p = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, bytes)); }
    catch (e) { throw new Error("the game file is damaged (part " + (n - 1) + ")"); }
    out.set(p, off); off += p.length;
    $("bar").style.width = (off * 100 / meta.size) + "%";
  };
  for (var i = 0; i < meta.parts.length; i++) {
    var res = await fetch(B + meta.parts[i] + "?v=" + meta.sha256.slice(0, 12));
    if (!res.ok) throw new Error("part " + meta.parts[i] + " did not load (" + res.status + ")");
    var rd = res.body.getReader();
    for (;;) {
      var r = await rd.read();
      if (r.done) break;
      bits.push(r.value); have += r.value.length;
      if (have < sealed) continue;
      var joined = join(bits, have), at = 0;
      while (joined.length - at >= sealed) { await openChunk(joined.subarray(at, at + sealed)); at += sealed; }
      bits = [joined.slice(at)]; have = bits[0].length;
    }
  }
  if (have) await openChunk(join(bits, have));   // the last, shorter chunk
  if (off !== meta.size) throw new Error("the game file came in short");
  return out;
}

// 1417: a music track for the game's browser player - its sealed file opened in memory, handed back as a blob URL; the
// track before it is let go, so only the one playing stays in memory
function musicGate(meta, key) {
  var last = "";
  window.pfGate = { music: async function (url) {
    var f = String(url).split("/").pop(), iv = meta.music[f];
    if (!iv) throw new Error("no such track " + f);
    var res = await fetch(B + "music/" + f + ".enc?v=" + meta.sha256.slice(0, 12));
    if (!res.ok) throw new Error("track " + f + " did not load (" + res.status + ")");
    var data = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv) }, key, await res.arrayBuffer());
    if (last) URL.revokeObjectURL(last);
    return (last = URL.createObjectURL(new Blob([data], { type: "audio/mpeg" })));
  } };
}

// the game: Godot's own loader from the build folder, fed the opened file as its main pack
function startGodot(meta, pack, code) {
  return new Promise(function (ok, fail) {
    var s = document.createElement("script"); s.src = B + "index.js"; s.onerror = function () { fail(new Error("the game engine did not load")); };
    s.onload = function () {
      var cfg = Object.assign({}, meta.godot, { executable: B + "index", canvas: $("canvas"), args: ["--", "gate_code=" + code] });
      var engine = new Engine(cfg);
      $("gate").hidden = true; $("canvas").hidden = false;
      engine.init(B + "index").then(function () { return engine.preloadFile(pack.buffer, "index.pck"); })
        .then(function () { return engine.start({ args: ["--main-pack", "index.pck", "--", "gate_code=" + code] }); }).then(ok, fail);
    };
    document.body.appendChild(s);
  });
}

$("f").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  var code = $("code").value.trim().toLowerCase();
  if (!code) return;
  $("go").disabled = true; say("CHECKING THE CODE...");
  try {
    var meta = await (await fetch(B + "gate.json", { cache: "no-store" })).json();
    var key = await gameKey(meta, code);
    if (!key) { say("THIS CODE DOES NOT OPEN THE GAME", "err"); $("go").disabled = false; return; }
    say("UNPACKING THE GAME...", "ok"); $("track").hidden = false;
    var pack = await openParts(meta, key);
    musicGate(meta, key);
    say("STARTING...", "ok");
    await startGodot(meta, pack, code);
  } catch (e) {
    say(String(e && e.message || e), "err"); $("go").disabled = false;
  }
});
$("code").focus();
